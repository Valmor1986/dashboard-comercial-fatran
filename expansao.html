<title>Mapa de Expansão FATRAN — Inteligência Comercial</title>
<style>
:root{
  color-scheme: light;
  --navy:#0C2442; --steel:#4F7492; --bronze:#A67F3C; --gold:#DBBC60; --gold-light:#E2CD81;
  --bg:#F4F6F8; --card:#FFFFFF; --text:#1C2733; --muted:#6B7A8B; --danger:#B3432E; --ok:#2E7D5B;
  --forte:#0C2442; --pouco:#DBBC60; --nao:#DCE2E8; --op:#A67F3C;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;}
.wrap{max-width:1280px;margin:0 auto;padding:16px 20px 60px;}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.topbar h1{font-size:17px;font-weight:800;color:var(--navy);margin:0;letter-spacing:.3px;}
.topbar .sub{font-size:11.5px;color:var(--muted);}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 16px;font-size:12.5px;}
.crumbs button{background:none;border:none;color:var(--steel);font-weight:700;cursor:pointer;padding:2px 4px;font-size:12.5px;}
.crumbs button:hover{color:var(--navy);text-decoration:underline;}
.crumbs .sep{color:var(--muted);}
.crumbs .current{color:var(--navy);font-weight:800;}
.card{background:var(--card);border:1px solid #E4E8EC;border-radius:12px;padding:16px 18px;margin-bottom:16px;}
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px;}
@media(max-width:950px){.kpi-row{grid-template-columns:repeat(3,1fr);} .kpi-row .kpi:nth-child(n+4){display:none}}
.kpi{background:var(--card);border:1px solid #E4E8EC;border-radius:12px;padding:12px 14px;}
.kpi .v{font-size:20px;font-weight:800;color:var(--navy);}
.kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-top:2px;}
h2.section{font-size:14px;color:var(--navy);font-weight:800;margin:22px 0 10px;letter-spacing:.2px;}
h2.section .tag{font-size:10px;background:var(--gold);color:var(--navy);border-radius:5px;padding:2px 7px;margin-left:8px;font-weight:800;vertical-align:middle;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:8px 0 4px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
.map-wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;}
#svg-map{width:420px;height:auto;flex-shrink:0;}
#svg-map a path{stroke:#fff;stroke-width:1.2;cursor:default;transition:opacity .15s;}
#svg-map a.active path{cursor:pointer;}
#svg-map a.active:hover path{opacity:.8;}
#svg-map text{font-size:9px;fill:#fff;pointer-events:none;font-weight:700;}
.state-list{flex:1;min-width:280px;display:flex;flex-direction:column;gap:8px;}
.state-row{display:flex;align-items:center;gap:10px;border:1px solid #E4E8EC;border-radius:10px;padding:9px 12px;cursor:pointer;background:#fff;transition:border-color .15s;}
.state-row:hover{border-color:var(--gold);}
.state-row .badge{width:14px;height:14px;border-radius:4px;flex-shrink:0;}
.state-row .nm{font-weight:800;color:var(--navy);font-size:13px;flex:1;}
.state-row .fat{font-size:12px;color:var(--muted);}
.state-row .score{font-size:11px;font-weight:800;color:#fff;background:var(--bronze);border-radius:6px;padding:2px 7px;}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.rcard{border:1px solid #E4E8EC;border-radius:11px;padding:13px 14px;cursor:pointer;background:#fff;transition:.15s;}
.rcard:hover{border-color:var(--gold);box-shadow:0 4px 14px rgba(12,36,66,.08);}
.rcard .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.rcard .name{font-weight:800;color:var(--navy);font-size:13px;line-height:1.3;}
.status-chip{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px;white-space:nowrap;}
.status-ATUA_FORTE{background:var(--navy);color:#fff;}
.status-ATUA_POUCO{background:var(--gold);color:var(--navy);}
.status-NAO_ATUA{background:var(--nao);color:var(--muted);}
.rcard .metrics{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:8px;}
.rcard .metrics b{color:var(--text);}
.btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:12px;cursor:pointer;}
.btn:hover{background:#163258;}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid #D6DCE2;}
.btn.ghost:hover{border-color:var(--gold);}
table.dt{width:100%;border-collapse:collapse;font-size:12px;}
table.dt th{text-align:left;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:7px 8px;border-bottom:2px solid #E4E8EC;}
table.dt td{padding:8px;border-bottom:1px solid #F0F2F5;}
table.dt tr:hover td{background:#FAFBFC;}
.filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.filters-bar select{font-size:12.5px;padding:7px 10px;border-radius:7px;border:1px solid #D6DCE2;background:#fff;color:var(--navy);font-weight:700;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}
.info-line{font-size:12.5px;line-height:1.55;color:var(--text);margin:4px 0;}
.info-line b{color:var(--navy);}
.small-muted{font-size:11px;color:var(--muted);}
.opp-card{border:2px solid var(--bronze);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:linear-gradient(180deg,#FFFDF7,#fff);cursor:pointer;}
.opp-card:hover{border-color:var(--gold);}
.opp-card .htitle{font-weight:800;color:var(--navy);font-size:13.5px;}
.opp-badges{display:flex;gap:8px;margin:7px 0;flex-wrap:wrap;}
.opp-badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;}
.b-score{background:var(--navy);color:#fff;}
.b-pot-alto,.b-pot-medio_alto{background:var(--ok);color:#fff;}
.b-pot-medio{background:var(--gold);color:var(--navy);}
.b-pot-baixo{background:var(--nao);color:var(--muted);}
.b-pres{background:#fff;border:1px solid #D6DCE2;color:var(--text);}
.b-nucleo1{background:#0C2442;color:#fff;}
.b-nucleo2{background:#8A6A1E;color:#fff;}
.b-nucleo3{background:#EDEFF2;color:var(--muted);border:1px solid #D6DCE2;}
.subblock{margin-top:16px;padding-top:14px;border-top:1px solid #E4E8EC;}
.subblock h3{font-size:12.5px;color:var(--navy);font-weight:800;margin:0 0 8px;text-transform:uppercase;letter-spacing:.3px;}
.company-row{border:1px solid #E4E8EC;border-radius:9px;padding:10px 12px;margin-bottom:8px;}
.company-row .nm{font-weight:800;color:var(--navy);font-size:12.5px;}
.prio{font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:20px;float:right;}
.prio-MUITO_ALTA{background:var(--danger);color:#fff;}
.prio-ALTA{background:var(--bronze);color:#fff;}
.prio-MEDIA{background:var(--gold);color:var(--navy);}
.prio-BAIXA{background:var(--nao);color:var(--muted);}
.note-box{background:#FCF6E8;border:1px solid #EAD9A0;border-radius:9px;padding:10px 12px;font-size:11.5px;color:#6B5A25;margin-top:8px;}
.warn-box{background:#FBEDEA;border:1px solid #E7BCAF;border-radius:9px;padding:10px 12px;font-size:11.5px;color:#7A2E1E;margin-top:8px;}
.score-explain{font-size:10.5px;color:var(--muted);cursor:help;border-bottom:1px dotted var(--muted);}
.rank-item{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F0F2F5;font-size:12.5px;}
.rank-item b{color:var(--navy);}
footer.note{margin-top:30px;font-size:10.5px;color:var(--muted);border-top:1px solid #E4E8EC;padding-top:12px;line-height:1.6;}
.tour-hero{background:linear-gradient(135deg,var(--navy),#163258);border-radius:14px;padding:22px 26px;color:#fff;margin-bottom:18px;}
.tour-hero h2{margin:0 0 8px;font-size:19px;color:#fff;}
.tour-hero p{margin:0;font-size:13px;color:#D6E0EA;line-height:1.6;max-width:760px;}
.tour-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#FCF6E8;border:1px solid #EAD9A0;border-radius:11px;padding:12px 16px;margin-bottom:18px;flex-wrap:wrap;}
.tour-banner .t{font-size:12.5px;color:#6B5A25;font-weight:700;}
.tour-step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #EEF1F4;}
.tour-step:last-child{border-bottom:none;}
.tour-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.tour-step .tstitle{font-weight:800;color:var(--navy);font-size:13px;margin-bottom:3px;}
.tour-step .tdesc{font-size:12.5px;color:var(--text);line-height:1.55;}
.tour-legend-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F0F2F5;font-size:12px;}
.tour-legend-row:last-child{border-bottom:none;}
.tour-nav-end{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
</style>
</head>

const OPPS = [{"id": "ba-camacari-quimico", "uf": "BA", "regiao": "Metropolitana de Salvador", "segmento": "Químico / Transformação Plástica", "titulo": "Químico/Plásticos — Metropolitana de Salvador (Polo de Camaçari)/BA", "score": 68, "potencial": "MEDIO_ALTO", "presenca_fatran": "BAIXA", "resumo": "Maior complexo petroquímico do Hemisfério Sul, na mesma cadeia de valor (resinas e aditivos para plástico/borracha) que já é o núcleo de negócio da FATRAN em SP, SC e PR.", "descricao": "O Polo Industrial de Camaçari completou 47 anos em 2025 e é ancorado pela Braskem, líder latino-americana em resinas termoplásticas (polietileno, polipropileno, PVC), com dezenas de indústrias químicas e petroquímicas de 2ª e 3ª geração interligadas ao complexo. A FATRAN já tem 3 clientes na Bahia que pertencem exatamente a essa cadeia — Grupo Imerys (aditivos minerais), Grupo Cromex (pigmentos/masterbatch para plástico) e Grupo Sansuy (transformados de PVC) — o que indica aderência real, não hipotética, ao segmento.", "mercado": {"tamanho": "Maior polo petroquímico do Hemisfério Sul; Braskem sozinha processa múltiplos milhões de toneladas/ano de nafta e derivados. Nº exato de empresas de 2ª/3ª geração instaladas não verificado nesta rodada — a COFIC (Comissão de Fábricas do Polo de Camaçari) é a fonte primária para esse levantamento.", "tipo_carga": "Resinas termoplásticas (polietileno, polipropileno, PVC) em big bags/sacaria, aditivos e cargas minerais — mesmo perfil físico que a FATRAN já transporta hoje."}, "presenca_atual": "R$1,46 milhão faturados em Metropolitana de Salvador nos últimos 12 meses (set/25–ago/26), 7 clientes, 100% frota terceirizada (frota própria 0% em toda a Bahia) — presença real mas rasa.", "empresas_alvo": [{"nome": "Braskem", "cidade": "Camaçari", "uf": "BA", "porte": "Grande", "papel": "Âncora do polo — produtora de resinas (polietileno, polipropileno, PVC)", "aderencia": "MEDIA", "observacao": "Grandes petroquímicas costumam contratar logística via licitação centralizada de grande porte — entrada direta é mais difícil que via 2ª/3ª geração. Site institucional: braskem.com.br.", "prioridade": "MEDIA"}, {"nome": "Grupo Imerys (BA)", "cidade": "Camaçari/RMS", "uf": "BA", "porte": "Grande", "papel": "Já é cliente FATRAN em outros estados (maior cliente histórico do grupo, R$8,8M acumulados) — candidato natural a expandir volume na Bahia", "aderencia": "ALTA", "observacao": "Cliente existente, não é prospecção fria — é expansão de conta.", "prioridade": "MUITO_ALTA"}, {"nome": "Grupo Cromex (BA)", "cidade": "Camaçari/RMS", "uf": "BA", "porte": "Média-Grande", "papel": "Pigmentos e masterbatch para a indústria plástica — já cliente FATRAN", "aderencia": "ALTA", "observacao": "Cliente existente na Bahia (R$629 mil acumulados) — candidato a aumento de share of wallet.", "prioridade": "ALTA"}], "empresas_alvo_nota": "Lista de empresas de 2ª/3ª geração do polo (fora da carteira atual da FATRAN) ainda não foi levantada com verificação individual de CNPJ/site — é o próximo passo de pesquisa dedicado, não uma lacuna a preencher com achismo.", "concorrentes": {"especializados_quimico": [{"nome": "Transkompa", "obs": "Especializada em transporte rodoviário de produtos químicos perigosos (sólidos, líquidos, gasosos) a granel — achada via pesquisa nacional, presença específica em Camaçari não confirmada nesta rodada.", "ameaca": "MEDIA"}, {"nome": "LogQuim Transportes", "obs": "Especializada em logística química — mesma ressalva de cobertura geográfica não confirmada.", "ameaca": "MEDIA"}, {"nome": "Transcomex Log", "obs": "Transporte de produtos perigosos a granel.", "ameaca": "BAIXA"}], "nota": "Os nomes acima vieram de uma busca nacional por 'transporte de produtos químicos', não de uma varredura específica de quem opera dentro do Polo de Camaçari — tratar como ponto de partida, não como mapeamento fechado. Concorrentes regionais baianos específicos ainda não identificados."}, "potencial_logistico": {"origem_destino": "SP/ES → BA (a FATRAN já tem escala forte nesses dois estados de origem) e potencialmente BA → SP/ES no retorno.", "aderencia_frota": "ALTA para o tipo de carga (mesmo perfil de aditivos/resinas que a frota já opera)", "risco_retorno_vazio": "NÃO AVALIADO — não há no histórico dados de frete de volta da Bahia para o Sudeste. Esta é a pergunta operacional mais importante antes de qualquer decisão de precificação: sem carga de retorno, o custo unitário sobe e a oportunidade pode deixar de ser atrativa.", "avaliacao": "Fisicamente compatível com a frota e a expertise atual da FATRAN. Viabilidade econômica real depende de resolver o retorno — não recomendamos avançar comercialmente antes de mapear isso."}, "acao_comercial": {"prioridade": "ALTA", "estrategia": "Relacionamento/expansão de conta para Imerys e Cromex (já clientes); prospecção direta apenas depois de mapear empresas de 2ª geração via COFIC.", "top5": ["Grupo Imerys (BA) — expansão de conta", "Grupo Cromex (BA) — expansão de conta", "Braskem — mapear via licitação/compras, não abordagem direta de vendedor", "Empresas de 2ª geração do polo — pendente de levantamento via COFIC", "Distribuidores/transformadores de resina na RMS — pendente de levantamento"], "argumento": "Para Imerys e Cromex: a FATRAN já opera a carga deles em outros estados com o mesmo padrão de qualidade — ampliar para a Bahia elimina a necessidade de gerir um segundo fornecedor logístico para o mesmo tipo de carga. Para o polo em geral: argumento só fica sólido depois de resolver a questão do frete de retorno."}}, {"id": "es-serra-siderurgia", "uf": "ES", "regiao": "Central Espírito-santense", "segmento": "Siderurgia / Aço", "titulo": "Siderurgia — Serra/Região Central Espírito-santense/ES", "score": 22, "potencial": "BAIXO", "presenca_fatran": "BAIXA", "resumo": "Mercado gigante (7,5 milhões de toneladas/ano) mas majoritariamente inacessível à frota rodoviária de lotação — escoamento é por porto e ferrovia, não por rodovia. Caso de estudo que mostra por que 'mercado grande' não é sinônimo de 'oportunidade FATRAN'.", "descricao": "A ArcelorMittal Tubarão, em Serra/ES, é uma das maiores usinas de semi-acabados de aço do mundo: 7,5 milhões de toneladas/ano de placas e bobinas laminadas a quente, para os mercados da América do Norte, América Latina, Europa e Ásia. A planta ocupa 13,5 milhões de m² e tem infraestrutura própria de escoamento: Terminal de Produtos Siderúrgicos de Praia Mole a 8 km (porto), e acesso ferroviário pelas ferrovias Vitória-Minas e Centro-Atlântica. O acesso rodoviário (BR-101 e BR-262) existe mas serve principalmente insumos e logística de apoio, não o escoamento do produto principal — que é a única fatia de volume relevante.", "mercado": {"tamanho": "7,5 milhões t/ano de produção — mas o produto principal (placas/bobinas) tem características físicas (peso/unidade, volume) e uma cadeia logística já verticalizada (porto próprio + ferrovia dedicada) que tornam a fatia endereçável por caminhão de lotação pequena frente ao total.", "tipo_carga": "Placas e bobinas de aço laminado a quente — carga de altíssimo peso específico, historicamente movida por navio/trem nessa escala."}, "presenca_atual": "Segmento AÇO soma R$1,13 milhão em ES nos últimos 12 meses (set/25–ago/26) — pequeno, provavelmente ligado a fornecedores/prestadores da cadeia, não ao escoamento principal da usina.", "empresas_alvo": [{"nome": "ArcelorMittal Tubarão", "cidade": "Serra", "uf": "ES", "porte": "Grande (multinacional)", "papel": "Produtora — mas escoamento do produto principal não é rodoviário", "aderencia": "BAIXA", "observacao": "Não recomendamos prospecção direta para o frete principal. Site institucional: brasil.arcelormittal.com.", "prioridade": "BAIXA"}], "empresas_alvo_nota": "A oportunidade real, se existir, está na cadeia de fornecedores (calcário, refratários, sucata) e nos service centers regionais que compram bobinas da ArcelorMittal e distribuem cortadas para clientes menores — esses sim movem por rodovia em volumes compatíveis com carga lotação. Nenhum desses foi verificado individualmente ainda; é pesquisa pendente, não uma lista pronta.", "concorrentes": {"especializados_quimico": [], "nota": "Não pesquisado nesta rodada — a decisão de não avançar com a ArcelorMittal como frete principal tornou o mapeamento de concorrentes de baixa prioridade até que a cadeia de fornecedores/service centers seja validada."}, "potencial_logistico": {"origem_destino": "Serra/ES (usina) → múltiplos destinos nacionais e internacionais via porto/ferrovia — fora do alcance rodoviário na escala principal.", "aderencia_frota": "BAIXA para o produto principal. Não avaliada para a cadeia de fornecedores/service centers.", "risco_retorno_vazio": "Não aplicável enquanto a oportunidade principal não for validada.", "avaliacao": "Avaliação operacional reprova a ArcelorMittal como alvo de frete principal. Regra do playbook cumprida: mercado existir não basta — teve de ser avaliado e, neste caso, descartado como estava."}, "acao_comercial": {"prioridade": "BAIXA", "estrategia": "Não prospectar a ArcelorMittal para o frete principal agora. Se houver interesse em aço, redirecionar a pesquisa para service centers e fornecedores da cadeia antes de qualquer contato comercial.", "top5": ["(nenhuma — lista de service centers/fornecedores ainda não levantada)"], "argumento": "Não construído — não há base para um argumento comercial sólido até a cadeia correta ser mapeada."}}];

// ---------- Scoring (metodologia transparente, não achismo) ----------
function scoreEstado(uf){
  const e = DATA.estados[uf];
  const all = Object.values(DATA.estados);
  const pcts = all.map(x=>x.pib_pct_nacional);
  const pibNorm = (e.pib_pct_nacional - Math.min(...pcts)) / (Math.max(...pcts) - Math.min(...pcts)) * 100;
  const gapPct = (e.regioes_total - e.regioes_ativas) / e.regioes_total * 100;
  const aderencia = e.top_segmentos.some(s=>s.segmento==='ADITIVOS E CARGAS MINERAIS') ? 100 : 40;
  const score = 0.5*pibNorm + 0.3*gapPct + 0.2*aderencia;
  return {score: Math.round(score), pibNorm: Math.round(pibNorm), gapPct: Math.round(gapPct), aderencia};
}
function scoreRegiao(uf, r){
  const e = DATA.estados[uf];
  const maxMuni = Math.max(...e.regioes.map(x=>x.n_municipios));
  const sizeNorm = maxMuni>0 ? (r.n_municipios/maxMuni*100) : 0;
  const gapFactor = r.status==='NAO_ATUA' ? 90 : (r.status==='ATUA_POUCO' ? 55 : 25);
  const score = 0.35*sizeNorm + 0.65*gapFactor;
  return Math.round(score);
}
function potenciaLabel(score){ return score>=65?'ALTO':(score>=40?'MÉDIO':'BAIXO'); }

// Dimensões de presença: origem (coleta) e destino (mercado) NUNCA são somadas —
// um mesmo frete tem uma UF de coleta e uma UF de entrega distintas; somar dobraria
// a contagem quando as duas coincidem. Cada estado guarda sua dimensão PRINCIPAL em
// faturamento_fatran/regioes (regioes_role indica qual é) e a dimensão secundária em
// origem (quando a principal é destino) ou destino_marginal (quando a principal é origem).
function presencaDims(e){
  if(e.regioes_role==='origem'){
    return { destino: e.destino_marginal ? e.destino_marginal.faturamento : 0, origem: e.faturamento_fatran };
  }
  return { destino: e.faturamento_fatran, origem: e.origem ? e.origem.faturamento : 0 };
}

    items.push({label:DATA.estados[ST.uf].nome, view:'estado', uf:ST.uf});
  }
  if(ST.regIdx!=null && (ST.view==='regiao'||ST.view==='oportunidade'||ST.view==='piloto'||ST.view==='whitespace')){
    items.push({label:DATA.estados[ST.uf].regioes[ST.regIdx].regiao, view:'regiao', uf:ST.uf, regIdx:ST.regIdx});
  }
  if(ST.view==='piloto'){
    const p = PILOTOS.find(x=>x.id===ST.pilotoId);
    items.push({label:p.segmento, view:'piloto', pilotoId:ST.pilotoId, uf:ST.uf, regIdx:ST.regIdx});
  }
  if(ST.view==='whitespace'){
    const key = ST.uf+'|'+DATA.estados[ST.uf].regioes[ST.regIdx].regiao;
    const seg = WHITESPACE[key].segmentos[ST.wsSegIdx];
    items.push({label:seg.nome, view:'whitespace', uf:ST.uf, regIdx:ST.regIdx, wsSegIdx:ST.wsSegIdx});
  }
  if(ST.view==='oportunidade'){
    const opp = OPPS.find(o=>o.id===ST.oppId);
    items.push({label:opp.segmento, view:'oportunidade', oppId:ST.oppId});
  }
  if(ST.view==='busca') items.push({label:'Buscar oportunidades', view:'busca'});
  if(ST.view==='tour') items.push({label:'Tour: como usar', view:'tour'});
  let html = '<div class="crumbs">';
  items.forEach((it,i)=>{
    if(i>0) html += '<span class="sep">›</span>';
    if(i===items.length-1) html += `<span class="current">${esc(it.label)}</span>`;
    else html += `<button onclick='navFromCrumb(${i})'>${esc(it.label)}</button>`;
  });
  html += '</div>';
  window.__crumbItems = items;
  return html;
}
function navFromCrumb(i){ const it = window.__crumbItems[i]; nav(it.view, it); }

  `;
}

function wireMap(){
  const svg = document.querySelector('#svg-map-holder svg');
  if(!svg) return;
  svg.setAttribute('id','svg-map');
  svg.querySelectorAll('a.estado').forEach(a=>{
    const code = a.getAttribute('data-code');
    const path = a.querySelector('path');
    if(DATA.estados[code]){
      a.classList.add('active');
      path.setAttribute('fill', STATUS_COLOR[DATA.estados[code].status_geral].replace('var(--forte)','#0C2442').replace('var(--pouco)','#DBBC60').replace('var(--nao)','#DCE2E8'));
      a.style.cursor='pointer';
      a.addEventListener('click', ()=>nav('estado',{uf:code}));
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      const bbox = path.getBBox();
      t.setAttribute('x', bbox.x+bbox.width/2-7);
      t.setAttribute('y', bbox.y+bbox.height/2+3);
      t.textContent = code;
      a.appendChild(t);
    } else {
      path.setAttribute('fill', '#EDEFF2');
      path.setAttribute('opacity', '0.6');
    }
  });
}

      <div class="info-line"><b>Tamanho:</b> ${esc(o.mercado.tamanho)}</div>

    </div>
    <div class="subblock"><h3>Presença FATRAN hoje</h3><div class="info-line">${esc(o.presenca_atual)}</div></div>
  </div>

  <h2 class="section">Empresas-alvo</h2>
  <div class="card">
    ${o.empresas_alvo.map(c=>`<div class="company-row">
      <span class="prio prio-${c.prioridade}">${c.prioridade.replace('_',' ')}</span>
      <div class="nm">${esc(c.nome)} <span class="small-muted">— ${esc(c.cidade)}/${c.uf}</span></div>
      <div class="info-line" style="margin:4px 0 0">${esc(c.papel)}</div>
      <div class="small-muted">Porte: ${esc(c.porte)} · Aderência FATRAN: ${esc(c.aderencia)}</div>
      <div class="small-muted" style="margin-top:3px;">${esc(c.observacao)}</div>
    </div>`).join('')}
    <div class="note-box">${esc(o.empresas_alvo_nota)}</div>
  </div>

  <h2 class="section">Concorrentes</h2>
  <div class="card">
    ${o.concorrentes.especializados_quimico.length ? `<h3 style="font-size:12px;color:var(--navy);">Concorrentes especializados</h3>
    ${o.concorrentes.especializados_quimico.map(c=>`<div class="company-row"><span class="prio prio-${c.ameaca==='ALTA'?'MUITO_ALTA':c.ameaca==='MEDIA'?'ALTA':'BAIXA'}">Ameaça ${c.ameaca}</span><div class="nm">${esc(c.nome)}</div><div class="small-muted" style="margin-top:3px;">${esc(c.obs)}</div></div>`).join('')}` : '<div class="small-muted">Nenhum concorrente pesquisado nesta rodada.</div>'}
    <div class="note-box">${esc(o.concorrentes.nota)}</div>
  </div>

  <h2 class="section">Potencial logístico</h2>
  <div class="card">
    <div class="info-line"><b>Origem/Destino:</b> ${esc(o.potencial_logistico.origem_destino)}</div>
    <div class="info-line"><b>Aderência à frota:</b> ${esc(o.potencial_logistico.aderencia_frota)}</div>
    <div class="info-line"><b>Risco de retorno vazio:</b> ${esc(o.potencial_logistico.risco_retorno_vazio)}</div>
    <div class="${o.potencial==='BAIXO'?'warn-box':'note-box'}"><b>Avaliação operacional:</b> ${esc(o.potencial_logistico.avaliacao)}</div>
  </div>

  <h2 class="section">Ação comercial</h2>
  <div class="card">
    <div class="info-line"><b>Prioridade comercial:</b> ${esc(o.acao_comercial.prioridade)}</div>
    <div class="info-line"><b>Estratégia de abordagem:</b> ${esc(o.acao_comercial.estrategia)}</div>
    <div class="subblock"><h3>Top empresas para atacar primeiro</h3>
      <ol>${o.acao_comercial.top5.map(t=>`<li class="info-line">${esc(t)}</li>`).join('')}</ol>
    </div>
    <div class="subblock"><h3>Argumento comercial</h3><div class="info-line">${esc(o.acao_comercial.argumento)}</div></div>
  </div>
  `;
}

function renderBusca(){
  const allRegs = [];
  Object.values(DATA.estados).forEach(e=>{
    e.regioes.forEach((r,idx)=>{
      allRegs.push({uf:e.uf, estado:e.nome, regIdx:idx, ...r, topSeg: r.segmentos_ativos[0]?r.segmentos_ativos[0].segmento:'—'});
    });
  });
  const segs = new Set(); allRegs.forEach(r=>r.segmentos_ativos.forEach(s=>segs.add(s.segmento)));
  let filtered = allRegs.filter(r=>{
    if(ST.fEstado && r.uf!==ST.fEstado) return false;
    if(ST.fStatus && r.status!==ST.fStatus) return false;
    if(ST.fSegmento && !r.segmentos_ativos.some(s=>s.segmento===ST.fSegmento)) return false;
    return true;
  }).sort((a,b)=>b.faturamento-a.faturamento);

  const ufOptions = Object.values(DATA.estados).map(e=>`<option value="${e.uf}" ${ST.fEstado===e.uf?'selected':''}>${e.nome}</option>`).join('');
  const segOptions = [...segs].sort().map(s=>`<option value="${s}" ${ST.fSegmento===s?'selected':''}>${s}</option>`).join('');

  return `
  <h2 class="section" style="margin-top:0">Buscar regiões/oportunidades — ${filtered.length} de ${allRegs.length}</h2>
  <div class="filters-bar">
    <select onchange="ST.fEstado=this.value;render()"><option value="">Todos os estados</option>${ufOptions}</select>
    <select onchange="ST.fStatus=this.value;render()">
      <option value="">Presença FATRAN: todas</option>
      <option value="ATUA_FORTE" ${ST.fStatus==='ATUA_FORTE'?'selected':''}>Atua forte</option>
      <option value="ATUA_POUCO" ${ST.fStatus==='ATUA_POUCO'?'selected':''}>Atua pouco</option>
      <option value="NAO_ATUA" ${ST.fStatus==='NAO_ATUA'?'selected':''}>Não atua</option>
    </select>
    <select onchange="ST.fSegmento=this.value;render()"><option value="">Todos os segmentos</option>${segOptions}</select>
    <button class="btn ghost" onclick="ST.fEstado='';ST.fStatus='';ST.fSegmento='';render()">Limpar filtros</button>
  </div>
  <div class="card">
  <table class="dt"><thead><tr><th>Estado</th><th>Região</th><th>Status</th><th>Segmento principal</th><th>Faturamento</th><th>Clientes</th></tr></thead><tbody>
    ${filtered.map(r=>`<tr style="cursor:pointer" onclick="nav('regiao',{uf:'${r.uf}',regIdx:${r.regIdx}})">
      <td>${r.uf}</td><td>${esc(r.regiao)}</td><td><span class="status-chip status-${r.status}">${STATUS_LABEL[r.status]}</span></td>
      <td>${esc(r.topSeg)}</td><td>${fmtBRL(r.faturamento)}</td><td>${r.clientes}</td>
    </tr>`).join('')}
  </tbody></table>
  </div>
  `;
}

render();
</script>

</html>
